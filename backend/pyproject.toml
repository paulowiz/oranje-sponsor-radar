[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oranje-sponsor-radar"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "SQLAlchemy>=2.0.38,<2.1",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.28,<0.29",
  "beautifulsoup4>=4.13,<5",
  "pydantic>=2.10,<3",
]

[tool.setuptools.packages.find]
include = ["radar*"]
