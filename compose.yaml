name: oranje-radar

x-backend: &backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment: &backend-environment
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:-radar}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    POSTGRES_DB: ${POSTGRES_DB:-radar}
    DEMO_MODE: ${DEMO_MODE:-false}
    DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
  volumes:
    - ./config:/app/config:ro
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-radar}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  init:
    <<: *backend
    command: ["python", "-m", "radar.cli", "init"]
    restart: "no"

  api:
    <<: *backend
    depends_on:
      init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    <<: *backend
    profiles: ["live"]
    environment:
      <<: *backend-environment
      REFRESH_HOUR_UTC: ${REFRESH_HOUR_UTC:-4}
    command: ["python", "-m", "radar.scheduler"]
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  analytics:
    <<: *backend
    profiles: ["tools"]
    command: ["dbt", "build", "--project-dir", "/app/analytics", "--profiles-dir", "/app/analytics"]
    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  postgres_data:
