name: Validate MVP

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: ci-only-not-for-deployment
          POSTGRES_DB: radar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: ci-only-not-for-deployment
      POSTGRES_DB: radar_test
      TEST_DATABASE_URL: postgresql+psycopg://radar:ci-only-not-for-deployment@localhost:5432/radar_test
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --group analytics
      - run: uv run --no-sync ruff check backend analytics/check_warehouse.py
      - run: uv run --no-sync ruff format --check backend analytics/check_warehouse.py
      - run: uv run --no-sync pytest backend/tests -q
      - name: Build and test analytics against a seeded PostgreSQL database
        env:
          DEMO_MODE: "true"
        run: |
          uv run --no-sync python -m radar.cli init
          uv run --no-sync python -m radar.cli seed-demo
          uv run --no-sync python -m radar.cli export-raw
          uv run --no-sync dbt build --project-dir analytics --profiles-dir analytics
      - name: Verify layered warehouse lineage and seeded data
        run: uv run --no-sync python analytics/check_warehouse.py
      - run: docker compose --profile live --profile tools config --quiet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
